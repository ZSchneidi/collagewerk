<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CollageWerk</title>
  <link rel="icon" href="icons/icon-32.png" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>CollageWerk</h1>

      <section>
        <h2>Bogen</h2>
        <label>Format
          <select id="preset"></select>
        </label>
        <div id="custom-size" class="row" hidden>
          <label>Breite (mm)<input id="custom-w" type="number" min="20" max="1000" step="1" /></label>
          <label>Höhe (mm)<input id="custom-h" type="number" min="20" max="1000" step="1" /></label>
        </div>
        <div class="seg" role="group" aria-label="Ausrichtung">
          <button id="orient-portrait" type="button">Hochformat</button>
          <button id="orient-landscape" type="button">Querformat</button>
        </div>
      </section>

      <section>
        <h2>Fotos</h2>
        <label>Anzahl Plätze <output id="count-out">4</output>
          <input id="count" type="range" min="1" max="12" step="1" />
        </label>
        <div id="templates" class="templates"></div>
        <label>Abstand <output id="gap-out"></output>
          <input id="gap" type="range" min="0" max="20" step="0.5" />
        </label>
        <label>Rand <output id="margin-out"></output>
          <input id="margin" type="range" min="0" max="30" step="0.5" />
        </label>
        <label class="inline">Hintergrund <input id="background" type="color" /></label>
      </section>

      <section id="crop-panel" hidden>
        <h2>Ausgewähltes Foto</h2>
        <label>Zoom <output id="zoom-out"></output>
          <input id="zoom" type="range" min="100" max="500" step="1" />
        </label>
        <div class="btns">
          <button id="rot-left" type="button" title="90° nach links drehen">⟲ Links</button>
          <button id="rot-right" type="button" title="90° nach rechts drehen">⟳ Rechts</button>
          <button id="mirror" type="button" title="Spiegeln">⇋ Spiegeln</button>
          <button id="reset-crop" type="button" title="Zuschnitt zurücksetzen (Doppelklick)">Zurücksetzen</button>
          <button id="to-tray" type="button" title="In die Ablage (Entf)">In Ablage</button>
        </div>
      </section>

      <section>
        <h2>Collage</h2>
        <div class="btns">
          <button id="add-photos" type="button">Fotos hinzufügen …</button>
          <button id="undo" type="button" title="Rückgängig (Strg+Z)">↶ Rückgängig</button>
          <button id="redo" type="button" title="Wiederholen (Strg+Y)">↷ Wiederholen</button>
          <button id="save-file" type="button">Collage speichern</button>
          <button id="open-file" type="button">Collage öffnen</button>
        </div>
        <div class="btns primary">
          <button id="print" type="button">Drucken</button>
          <button id="export-png" type="button">PNG exportieren</button>
        </div>
        <p class="hint" id="print-hint">Im Druckdialog <b>Ränder: Keine</b> und <b>Skalierung: 100 %</b> wählen, damit die Collage maßstabsgetreu gedruckt wird.</p>
      </section>
      <input id="file-photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden />
      <input id="file-collage" type="file" accept=".collagewerk,.json,application/json" hidden />
    </aside>

    <main id="stage">
      <div id="sheet-wrap">
        <canvas id="sheet"></canvas>
        <div id="overlay"></div>
      </div>
    </main>

    <footer id="tray">
      <span class="tray-label">Ablage</span>
      <div id="tray-items"></div>
    </footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print-root"></div>
  <script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
